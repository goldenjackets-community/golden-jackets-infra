  # --- Domain & Certificate Expiration Monitor (Lambda) ---
  MonitorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: gj-expiration-monitor-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: gj-monitor-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - route53domains:GetDomainDetail
                  - route53domains:ListDomains
                  - acm:ListCertificates
                  - acm:DescribeCertificate
                Resource: '*'
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref AlertTopic
      Tags:
        - Key: project
          Value: golden-jackets

  ExpirationMonitor:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: gj-expiration-monitor
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt MonitorRole.Arn
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref AlertTopic
          DOMAIN_WARNING_DAYS: '30'
          CERT_WARNING_DAYS: '30'
      Tags:
        - Key: project
          Value: golden-jackets
      Code:
        ZipFile: |
          import boto3
          import os
          from datetime import datetime, timezone

          def handler(event, context):
              sns = boto3.client('sns')
              topic_arn = os.environ['SNS_TOPIC_ARN']
              domain_warn = int(os.environ['DOMAIN_WARNING_DAYS'])
              cert_warn = int(os.environ['CERT_WARNING_DAYS'])
              alerts = []
              now = datetime.now(timezone.utc)

              # Check domain expirations
              r53d = boto3.client('route53domains', region_name='us-east-1')
              domains = r53d.list_domains()['Domains']
              for d in domains:
                  name = d['DomainName']
                  if 'goldenjackets' not in name:
                      continue
                  detail = r53d.get_domain_detail(DomainName=name)
                  exp = detail['ExpirationDate']
                  if exp.tzinfo is None:
                      exp = exp.replace(tzinfo=timezone.utc)
                  days_left = (exp - now).days
                  if days_left <= domain_warn:
                      alerts.append(f"DOMAIN EXPIRING: {name} expires in {days_left} days ({exp.strftime('%Y-%m-%d')})")
                  # Check clientHold
                  statuses = detail.get('StatusList', [])
                  if 'clientHold' in statuses:
                      alerts.append(f"DOMAIN SUSPENDED: {name} has clientHold status - DNS not resolving!")

              # Check ACM certificate expirations
              acm = boto3.client('acm', region_name='us-east-1')
              certs = acm.list_certificates(CertificateStatuses=['ISSUED'])['CertificateSummaryList']
              for c in certs:
                  arn = c['CertificateArn']
                  domain = c.get('DomainName', '')
                  if 'goldenjackets' not in domain:
                      continue
                  detail = acm.describe_certificate(CertificateArn=arn)['Certificate']
                  not_after = detail.get('NotAfter')
                  if not_after:
                      if not_after.tzinfo is None:
                          not_after = not_after.replace(tzinfo=timezone.utc)
                      days_left = (not_after - now).days
                      if days_left <= cert_warn:
                          alerts.append(f"CERT EXPIRING: {domain} cert expires in {days_left} days ({not_after.strftime('%Y-%m-%d')})")

              if alerts:
                  message = "Golden Jackets Expiration Alerts:\n\n" + "\n".join(alerts)
                  sns.publish(
                      TopicArn=topic_arn,
                      Subject="[GJ] Domain/Certificate Expiration Alert",
                      Message=message
                  )
                  print(f"Sent {len(alerts)} alerts")
              else:
                  print("All domains and certs OK")

              return {'statusCode': 200, 'alerts': len(alerts)}

  MonitorSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: gj-expiration-check-daily
      Description: Daily check for domain and certificate expirations
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Id: expiration-monitor
          Arn: !GetAtt ExpirationMonitor.Arn

  MonitorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ExpirationMonitor
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonitorSchedule.Arn

Outputs:
  TopicArn:
    Value: !Ref AlertTopic
    Description: SNS Topic ARN for alerts
  HealthCheckCount:
    Value: '16'
    Description: Number of health checks created
  MonitorFunction:
    Value: !Ref ExpirationMonitor
    Description: Expiration monitor Lambda function name
