AWSTemplateFormatVersion: '2010-09-09'
Description: Golden Jackets - Basic Observability (Health Checks, Alarms, Domain/Cert Monitoring)

Parameters:
  AlertEmail:
    Type: String
    Default: ricardo.gulias@cloud2point.com.br
    Description: Email to receive alerts

