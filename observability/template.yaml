  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: gj-site-alerts
      Tags:
        - Key: project
          Value: golden-jackets

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref AlertTopic

